name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  integration:
    name: Integration Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: ['sqlite', 'postgres']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Download dependencies
        run: go mod download

      - name: Wait for PostgreSQL
        if: matrix.database == 'postgres'
        timeout-minutes: 2
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done

      - name: Run integration tests (SQLite)
        if: matrix.database == 'sqlite'
        run: |
          go test -v -timeout=10m \
            -run 'TestDatabase|TestSMTP|TestQueue|TestAdmin' \
            ./tests/integration/...
        env:
          TEST_DATABASE_TYPE: sqlite

      - name: Run integration tests (PostgreSQL)
        if: matrix.database == 'postgres'
        run: |
          go test -v -timeout=10m \
            -run 'TestDatabase|TestSMTP|TestQueue|TestAdmin' \
            ./tests/integration/...
        env:
          TEST_POSTGRES_DSN: postgres://postgres:testpass@localhost:5432/testdb?sslmode=disable
          TEST_DATABASE_TYPE: postgres

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-${{ matrix.database }}
          path: /tmp/test-logs/

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✓ Integration Tests (${{ matrix.database }}) Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✗ Integration Tests (${{ matrix.database }}) Failed" >> $GITHUB_STEP_SUMMARY
          fi
