name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.x']
        database: ['sqlite', 'postgres']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Wait for PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done

      - name: Wait for Redis
        run: |
          until redis-cli -h localhost ping; do
            echo 'Waiting for Redis...'
            sleep 1
          done

      - name: Run integration tests (SQLite)
        if: matrix.database == 'sqlite'
        run: |
          go test -v -timeout=10m \
            -run 'TestDatabase|TestSMTP|TestQueue|TestAdmin' \
            ./tests/integration/...
        env:
          TEST_DATABASE_TYPE: sqlite

      - name: Run integration tests (PostgreSQL)
        if: matrix.database == 'postgres'
        run: |
          go test -v -timeout=10m \
            -run 'TestDatabase|TestSMTP|TestQueue|TestAdmin' \
            ./tests/integration/...
        env:
          TEST_POSTGRES_DSN: postgres://postgres:testpass@localhost:5432/testdb?sslmode=disable
          TEST_DATABASE_TYPE: postgres

      - name: Run integration tests (Redis)
        run: |
          go test -v -timeout=10m \
            -run 'TestRedis' \
            ./tests/integration/...
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-${{ matrix.database }}
          path: /tmp/test-logs/

  integration-summary:
    name: Integration Tests Summary
    runs-on: ubuntu-latest
    needs: integration
    if: always()
    steps:
      - name: Check integration tests status
        run: |
          if [ "${{ needs.integration.result }}" == "success" ]; then
            echo "✓ All integration tests passed"
            exit 0
          else
            echo "✗ Some integration tests failed"
            exit 1
          fi
