{{define "2fa_verify.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Mail Server Admin</title>
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; margin-bottom: 0.5rem; color: var(--primary); }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 0.5em;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .checkbox-group input { width: 1rem; height: 1rem; }
        .checkbox-group label { margin: 0; font-weight: normal; color: #64748b; }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn:hover { background: #1d4ed8; }
        .alert { padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; }
        .alert-danger { background: #fee2e2; color: var(--danger); }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: var(--primary); text-decoration: none; }
        .icon { font-size: 3rem; text-align: center; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔐</div>
        <h1>Two-Factor Authentication</h1>
        <p class="subtitle">Enter the 6-digit code from your authenticator app</p>

        {{if .Error}}
        <div class="alert alert-danger">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/admin/2fa/verify">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" id="code" name="code" class="form-control"
                       pattern="[0-9]{6}" maxlength="6" inputmode="numeric"
                       autocomplete="one-time-code" required autofocus
                       placeholder="000000">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Trust this device for 30 days</label>
            </div>

            <button type="submit" class="btn">Verify</button>
        </form>

        <div class="back-link">
            <a href="/admin/login">Back to login</a>
        </div>
    </div>

    <script>
        // Auto-submit when 6 digits entered
        document.getElementById('code').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length === 6) {
                this.form.submit();
            }
        });
    </script>
</body>
</html>
{{end}}
