<div class="breadcrumbs">
    <a href="/admin/">home</a>
    <span>&gt;</span>
    <a href="/admin/features">features</a>
    <span>&gt;</span>
    <a href="/admin/features/scheduled">send later</a>
    <span>&gt;</span>
    <span>schedule</span>
</div>

<div class="page-header">
    <h1>schedule email</h1>
</div>

{{if .Error}}
<div class="alert alert-danger">{{.Error}}</div>
{{end}}

<div class="card">
    <form method="POST" action="/admin/features/scheduled/add">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="form-group">
            <label for="from_address">from</label>
            <select id="from_address" name="from_address" class="form-control" style="max-width: 400px;" required>
                {{range .FromAddresses}}
                <option value="{{.Email}}">{{.Email}} ({{.Description}})</option>
                {{end}}
            </select>
        </div>

        <div class="form-group">
            <label for="recipients">to (comma-separated)</label>
            <input type="text" id="recipients" name="recipients" class="form-control" style="max-width: 400px;"
                   placeholder="recipient@example.com, another@example.com" required>
            <small style="color: var(--text-muted); display: block; margin-top: 0.25rem; font-size: 11px;">separate multiple recipients with commas</small>
        </div>

        <div class="form-group">
            <label for="subject">subject</label>
            <input type="text" id="subject" name="subject" class="form-control" style="max-width: 500px;"
                   placeholder="email subject">
        </div>

        <div class="form-group">
            <label for="body">message</label>
            <textarea id="body" name="body" class="form-control" rows="10"
                      placeholder="write your message here..."></textarea>
        </div>

        <div class="form-group">
            <label for="send_at">send at</label>
            <input type="datetime-local" id="send_at" name="send_at" class="form-control" style="max-width: 300px;" required>
            <small style="color: var(--text-muted); display: block; margin-top: 0.25rem; font-size: 11px;">when to send this email</small>
        </div>

        <div style="margin-top: 1rem;">
            <button type="submit" class="btn btn-primary">schedule email</button>
            <a href="/admin/features/scheduled" class="btn btn-secondary">cancel</a>
        </div>
    </form>
</div>
