<div class="page-header">
    <h1>Add Domain</h1>
</div>

{{if .Error}}
<div class="alert alert-danger">{{.Error}}</div>
{{end}}

{{if .Success}}
<div class="alert alert-success">{{.Success}}</div>
{{end}}

<div class="card">
    <h2>Domain Settings</h2>
    <form method="POST" action="/admin/domains/add">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="form-group">
            <label for="name">Domain Name</label>
            <input type="text" id="name" name="name" class="form-control" required
                   placeholder="example.com" value="{{.Domain}}" autocomplete="off">
            <small style="color: var(--text-muted);">e.g., example.com, mail.example.org</small>
        </div>

        <div class="form-group" style="margin-top: 1.5rem;">
            <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">DKIM Configuration</h3>
            <div style="padding: 1rem; background: var(--bg); border-radius: 6px;">
                <div class="form-group">
                    <label for="dkim_selector">DKIM Selector</label>
                    <input type="text" id="dkim_selector" name="dkim_selector" value="mail" class="form-control">
                    <small style="color: var(--text-muted);">Usually "mail" or "default"</small>
                </div>
                <div class="form-group">
                    <label for="dkim_bits">Key Size</label>
                    <select id="dkim_bits" name="dkim_bits" class="form-control">
                        <option value="2048" selected>2048 bits (recommended)</option>
                        <option value="4096">4096 bits</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dkim_storage">Key Storage</label>
                    <select id="dkim_storage" name="dkim_storage" class="form-control">
                        <option value="database" selected>Database</option>
                        <option value="file">File System</option>
                        <option value="hybrid">Both (Hybrid)</option>
                    </select>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="generate_dkim" name="generate_dkim" checked>
                    <label for="generate_dkim">Generate DKIM key automatically</label>
                </div>
            </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <a href="/admin/domains" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Domain</button>
        </div>
    </form>
</div>
