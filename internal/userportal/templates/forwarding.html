<h1>Email Forwarding</h1>

<div class="card">
    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    {{if .Success}}
    <div class="alert alert-success">{{.Success}}</div>
    {{end}}

    <form method="POST" action="/account/forwarding">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="form-group">
            <label class="checkbox">
                <input type="checkbox" name="is_active" {{if .IsActive}}checked{{end}}>
                Enable email forwarding
            </label>
        </div>

        <div class="form-group">
            <label for="forward_to">Forward To</label>
            <input type="email" id="forward_to" name="forward_to"
                   value="{{.ForwardTo}}" placeholder="other@example.com">
            <small class="text-muted">All incoming emails will be forwarded to this address</small>
        </div>

        <div class="form-group">
            <label class="checkbox">
                <input type="checkbox" name="keep_copy" {{if .KeepCopy}}checked{{end}}>
                Keep a copy of forwarded emails in my mailbox
            </label>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Save Settings</button>
            <a href="/account/" class="btn">Cancel</a>
        </div>
    </form>
</div>
