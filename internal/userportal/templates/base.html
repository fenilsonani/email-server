<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - {{if .Domain}}{{.Domain.Name}}{{else}}Mail{{end}} Account</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    {{if .User}}
    <nav role="navigation" aria-label="Main navigation">
        <div class="container">
            <a href="/account/" class="brand">{{if .Domain}}{{.Domain.Name}}{{else}}My Account{{end}}</a>
            <div class="nav-links">
                <a href="/account/">dashboard</a>
                <span class="nav-separator">|</span>
                <a href="/account/password">password</a>
                <span class="nav-separator">|</span>
                <a href="/account/profile">profile</a>
                <span class="nav-separator">|</span>
                <a href="/account/forwarding">forwarding</a>
                <span class="nav-separator">|</span>
                <a href="/account/vacation">vacation</a>
                <span style="flex: 1"></span>
                <span class="nav-user">{{.User.Email}}</span>
                <span class="nav-separator">|</span>
                <form method="POST" action="/account/logout" style="display: inline;">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <button type="submit" class="btn-link">logout</button>
                </form>
            </div>
        </div>
    </nav>
    {{end}}

    <main role="main" class="container" id="main-content">
        <!-- CONTENT_PLACEHOLDER -->
    </main>
</body>
</html>
