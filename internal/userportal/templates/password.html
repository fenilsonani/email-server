<h1>Change Password</h1>

<div class="card">
    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    {{if .Success}}
    <div class="alert alert-success">{{.Success}}</div>
    {{end}}

    <form method="POST" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required
                   autocomplete="current-password">
            <small class="text-muted">Enter your current password to verify your identity</small>
        </div>

        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required
                   minlength="8" maxlength="128" autocomplete="new-password">
            <small class="text-muted">Must be 8-128 characters</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   minlength="8" maxlength="128" autocomplete="new-password">
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Change Password</button>
            <a href="/account/" class="btn">Cancel</a>
        </div>
    </form>
</div>
