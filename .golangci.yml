run:
  deadline: 5m
  tests: true
  skip-dirs:
    - vendor
    - tests/shared/fixtures

linters:
  enable:
    - gosec
    - govet
    - errcheck
    - staticcheck
  disable:
    - gosimple
    - unused

linters-settings:
  gosec:
    # Exclude test files from strict security checks
    excludes:
      - G101  # SQL string
      - G102  # SQL concat
      - G201  # SQL injection
      - G202  # SQL concat
      - G203  # HTML injection
      - G204  # Command execution
      - G205  # File permissions
      - G301  # File permissions
      - G302  # File permissions
      - G303  # File permissions
      - G304  # File read
      - G305  # ZIP compression
    # Skip tests for certain rules
    tests: true
    config: .gosec.json

issues:
  exclude-rules:
    # Ignore gosec issues in test files - test data and security vectors are intentional
    - path: tests/
      linters:
        - gosec
      text: |
        G101|G102|G201|G202|G203|G204|G205|G301|G302|G303|G304|G305|G306|G307|G308|G309|G310|G401|G402|G403|G404|G501|G502|G503|G504|G505|G506|G507|G508|G509|G601|G602|G603|G604|G605|G606|G607
    # Ignore unused functions kept for backward compatibility and future use
    - linters:
        - staticcheck
      text: 'is unused'
    # API middleware utilities (future use)
    - path: internal/api/middleware.go
      linters:
        - staticcheck
      text: '(requireScope|hasScope|hashAPIKey|verifyAPIKeyHash).*unused'
    # Admin middleware utilities (future use)
    - path: internal/admin/middleware.go
      linters:
        - staticcheck
      text: '(withTimeout|withPrimaryDomainOnly).*unused'
    # TOTP device management (feature management)
    - path: internal/admin/totp.go
      linters:
        - staticcheck
      text: '(removeTrustedDevice|cleanupExpiredTrustedDevices).*unused'
    # Auth validation utility (backward compatibility)
    - path: internal/auth/auth.go
      linters:
        - staticcheck
      text: 'validateUsername.*unused'
    # Audit test helper (test infrastructure)
    - path: internal/audit/audit_edge_test.go
      linters:
        - staticcheck
      text: 'createPostgresAuditTable.*unused'
